<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حماية السيبراني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#060610 url('bg.jpg') center/cover no-repeat fixed}
body::before{content:'';position:fixed;inset:0;background:rgba(6,6,16,0.65);backdrop-filter:blur(2px)}
.neon{position:relative;z-index:2;background:rgba(15,10,40,0.9);border:1.5px solid #00e5ff66;border-radius:28px;padding:22px;width:92%;max-width:400px;box-shadow:0 0 40px #00e5ff33}
.inp{width:100%;background:rgba(10,10,26,0.9);border:1.5px solid #3a3a6a;border-radius:14px;padding:12px;color:#fff;text-align:center;outline:none;margin-top:6px}
.btn{width:100%;background:linear-gradient(90deg,#7b3eff,#00d4ff);border:none;border-radius:30px;padding:12px;font-weight:800;color:#fff;margin-top:12px;cursor:pointer}
.chat{display:none;position:fixed;inset:0;background:#080818 url('chat-bg.jpg') center/cover no-repeat fixed;flex-direction:column;z-index:10}
.head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;margin:8px;border:1.5px solid #00e5ff44;border-radius:16px;background:#0a0f23ee}
.group-title{font-family:'Amiri',serif;font-size:18px;background:linear-gradient(90deg,#00e5ff,#7b3eff,#ff00aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 8px #00e5ff);font-weight:700;letter-spacing:1px}
.msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:7px;background:rgba(8,8,24,0.55)}
.m{max-width:82%;padding:8px 11px;border-radius:14px;font-size:13px;word-break:break-word;position:relative}
.in{align-self:flex-start;background:#1e2d50ee;border-radius:14px 14px 14px 0} .out{align-self:flex-end;background:#5a1e6bee;border-radius:14px 14px 0 14px}
.private{border:1px dashed #ffaa00; box-shadow:0 0 10px #ffaa0055}
.input-bar{display:flex;align-items:center;gap:4px;padding:6px 8px;margin:8px;border:1.5px solid #00e5ff44;border-radius:30px;background:#0a0a1eee}
.input-bar input{flex:1;background:transparent;border:none;outline:none;color:#fff}
.icon{cursor:pointer;font-size:18px;padding:3px}
.tabs{display:flex;gap:6px;margin:0 8px}
.tab{padding:4px 12px;border-radius:20px;font-size:11px;cursor:pointer;background:#1a1a3a;color:#8a8ab0}
.tab.active{background:#7b3eff;color:#fff}
#users{max-height:120px;overflow:auto;background:#0a0a1e;padding:6px;border-radius:10px;margin:6px 8px;display:none}
.user-row{display:flex;justify-content:space-between;padding:5px 8px;font-size:12px;border-bottom:1px solid #1a1a3a;cursor:pointer}
</style>
</head>
<body>

<div id="login" class="neon">
<h2 id="secretTitle" style="text-align:center;user-select:none">👻 GHOSTCOM</h2>
<p style="text-align:center;font-family:'Amiri';font-size:20px;background:linear-gradient(90deg,#00e5ff,#ff00aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent">✦ حـمـايـة الـسـيـبـرانـي ✦</p>
<p style="text-align:center;font-size:10px;color:#00e5ff;margin:6px">جروب آمن - دخول بدعوة من المالك فقط</p>
<div style="font-size:11px;color:#8a8ab0;text-align:right;margin-top:10px">اسمك</div><input id="uname" class="inp" placeholder="اكتب اسمك المستعار">
<div style="font-size:11px;color:#8a8ab0;text-align:right;margin-top:8px">كود الدعوة</div><input id="icode" class="inp" placeholder="GHOST-XXXX-XXXX">
<button class="btn" onclick="enterG()">دخول الجروب</button>
<div style="font-size:9px;text-align:center;color:#5a5a7a;margin-top:8px">الكود يفتح مرة واحدة ويحترق تلقائياً ✅<br>بعدها تدخل وتخرج متى ما تشاء</div>
</div>

<div id="dev" class="neon" style="display:none">
<h3 style="text-align:center">👑 لوحة المالك السرية</h3>
<p id="devInfo" style="font-size:9px;text-align:center;color:#00ff88"></p>
<button class="btn" style="background:linear-gradient(90deg,#7b3eff,#b03eff)" onclick="gen()">+ توليد كود جديد</button>
<button class="btn" style="background:linear-gradient(90deg,#00c87a,#00e0a0);color:#000" onclick="share()">📤 نسخ آخر كود</button>
<div id="list" style="max-height:200px;overflow:auto;margin-top:8px"></div>
<button class="btn" style="background:#222" onclick="back()">رجوع</button>
</div>

<div id="chat" class="chat">
<div class="head"><span onclick="back()" style="cursor:pointer">←</span><div><div class="group-title">༺ حـمـايـة الـسـيـبـرانـي ༻</div><div style="font-size:9px;color:#00ff88" id="online">متصل الآن</div></div><span onclick="toggleUsers()" style="background:#7b3eff;padding:5px 10px;border-radius:20px;font-size:11px;cursor:pointer">👥 الأعضاء</span></div>
<div class="tabs"><div class="tab active" id="tabAll" onclick="setTab('all')">🌐 العام - يشوفه الجميع</div><div class="tab" id="tabPriv" onclick="setTab('private')">🔒 الخاص</div></div>
<div id="users"></div>
<div class="msgs" id="msgs"></div>
<div style="font-size:9px;color:#ffaa00;text-align:center;display:none" id="privHint">🔒 ترسل خاص إلى: <b id="privTo"></b> <span onclick="cancelPriv()" style="color:#ff3a5a;cursor:pointer">[إلغاء]</span></div>
<div class="input-bar">
<span class="icon" onclick="imgInput.click()">📷</span>
<span class="icon" onclick="videoInput.click()">🎬</span>
<span class="icon" onclick="fileInput.click()">📎</span>
<span class="icon" id="recBtn" onclick="toggleRec()">🎤</span>
<input id="minp" placeholder="رسالة عامة..." onkeypress="if(event.key==='Enter')sendM()">
<button style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ff00aa,#7b3eff);border:none;color:#fff" onclick="sendM()">◁</button>
</div>
<input type="file" id="imgInput" accept="image/*" hidden>
<input type="file" id="videoInput" accept="video/*" hidden>
<input type="file" id="fileInput" hidden>
</div>

<script>
const firebaseConfig={apiKey:"PUT-YOUR-KEY",authDomain:"ghostcom-xxxxx.firebaseapp.com",databaseURL:"https://ghostcom-xxxxx-default-rtdb.firebaseio.com",projectId:"ghostcom-xxxxx",storageBucket:"ghostcom-xxxxx.appspot.com",messagingSenderId:"123456",appId:"1:123:web:abc"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database(), storage=firebase.storage();
const OWNER_CODE="DEV-X9K2-ADMIN", OWNER_PASS="Ghost@2026_Ibb";
let myName="",last="GHOST-DEMO-2026", mediaRecorder, audioChunks=[], isRec=false, privateTo=null, currentTab='all', allMsgs=[];
let codesRef=db.ref('codes'), msgRef=db.ref('rooms/CYBER-PROTECT/messages'), ownerRef=db.ref('ownerDevice'), usersRef=db.ref('rooms/CYBER-PROTECT/users');

function getDeviceId(){let id=localStorage.getItem('ghost_device_id');if(!id){id='DEV-'+Math.random().toString(36).substr(2,9).toUpperCase();localStorage.setItem('ghost_device_id',id);}return id;}
let clickCount=0; secretTitle.onclick=()=>{clickCount++; if(clickCount>=7){let p=prompt("🔐 كلمة سر المالك:"); if(p===OWNER_PASS){ownerRef.once('value',s=>{let saved=s.val(),my=getDeviceId(); if(saved&&saved!==my){alert('🚫 جهاز غير مصرح');return;} if(!saved)ownerRef.set(my); devInfo.innerText="✅ جهازك: "+my; login.style.display='none'; dev.style.display='block'; loadCodes();});} clickCount=0; } setTimeout(()=>clickCount=0,3000);};

function enterG(){
 let n=uname.value.trim(), c=icode.value.trim().toUpperCase();
 if(!n||!c){alert('اكتب الاسم والكود');return}
 if(c===OWNER_CODE){alert('لوحة المالك مخفية - اضغط 7 مرات على GHOSTCOM 👆');return;}
 codesRef.child(c).once('value',snap=>{
  if(!snap.exists()){alert('كود خطأ ❌');return}
  if(snap.val().used){alert('الكود محروق 🔥 اطلب كود جديد من المالك');return}
  codesRef.child(c).update({used:true,userName:n,time:Date.now()});
  localStorage.setItem('ghost_login',JSON.stringify({name:n,code:c,ok:true}));
  myName=n; login.style.display='none'; chat.style.display='flex'; usersRef.child(myName).set({online:true,time:Date.now()}); listen();
 });
}
window.addEventListener('load',()=>{let s=localStorage.getItem('ghost_login'); if(s){try{let o=JSON.parse(s); if(o.ok){myName=o.name; login.style.display='none'; chat.style.display='flex'; usersRef.child(myName).set({online:true}); listen();}}catch(e){}}});
function gen(){let ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',a='',b='';for(let i=0;i<4;i++){a+=ch[Math.floor(Math.random()*ch.length)];b+=ch[Math.floor(Math.random()*ch.length)]}let nc='GHOST-'+a+'-'+b; codesRef.child(nc).set({code:nc,used:false,time:Date.now()}); last=nc; loadCodes();}
function share(){navigator.clipboard.writeText(last); alert('تم نسخ: '+last);}
function loadCodes(){codesRef.on('value',snap=>{let h='',cnt=0; snap.forEach(s=>{let v=s.val(); if(!v.used)cnt++; h=`<div style="background:#000a;border:1px solid #3a2a6a;border-radius:8px;padding:6px;margin:4px 0;display:flex;justify-content:space-between;font-size:11px"><span>${v.code}</span><span style="color:${v.used?'#ff3a5a':'#00ff88'}">${v.used?'🔥 '+v.userName:'✅'}</span></div>`+h;}); list.innerHTML=h+`<div style=text-align:center;color:#00ff88>متاح: ${cnt}</div>`;});}
function back(){dev.style.display='none'; chat.style.display='none'; login.style.display='block';}
function toggleUsers(){users.style.display=users.style.display==='none'?'block':'none';}
function listen(){
 msgRef.on('child_added',s=>{allMsgs.push(s.val()); renderMsgs();});
 msgRef.on('value',s=>{online.innerText=s.numChildren()+' رسالة - حماية السيبراني';});
 usersRef.on('value',snap=>{let h=''; snap.forEach(u=>{h+=`<div class=user-row onclick="setPrivate('${u.key}')"><span>${u.key} 🟢</span><span style="color:#00e5ff">خاص 🔒</span></div>`;}); users.innerHTML=h||'لا أحد';});
}
function renderMsgs(){
 msgs.innerHTML=''; allMsgs.forEach(d=>{
  let isPriv = d.to;
  let show = false;
  if(currentTab==='all' && !isPriv) show=true;
  if(currentTab==='private' && isPriv && (d.name===myName || d.to===myName)) show=true;
  if(!show) return;
  let el=document.createElement('div'); el.className='m '+(d.name===myName?'out':'in')+(isPriv?' private':'');
  let content=d.text;
  if(d.type==='image') content=`<img src="${d.text}" style="max-width:180px;border-radius:10px" onclick="window.open(this.src)">`;
  else if(d.type==='video') content=`<video src="${d.text}" controls style="max-width:200px;border-radius:10px"></video>`;
  else if(d.type==='voice' || d.type==='audio') content=`<audio controls src="${d.text}" style="width:160px"></audio>`;
  else if(d.type==='file') content=`<a href="${d.text}" target="_blank" style="color:#00e5ff">📄 ${d.fileName}</a>`;
  let privLabel = isPriv?`🔒 خاص إلى ${d.to}<br>`:'';
  el.innerHTML=`<b style="font-size:9px;color:#00e5ff">${d.name}</b><br>${privLabel}${content}`; msgs.appendChild(el);
 }); msgs.scrollTop=msgs.scrollHeight;
}
function setTab(t){currentTab=t; tabAll.className=t==='all'?'tab active':'tab'; tabPriv.className=t==='private'?'tab active':'tab'; renderMsgs();}
function setPrivate(name){if(name===myName)return; privateTo=name; privTo.innerText=name; privHint.style.display='block'; minp.placeholder='رسالة خاصة إلى '+name+'...'; toggleUsers(); setTab('private');}
function cancelPriv(){privateTo=null; privHint.style.display='none'; minp.placeholder='رسالة عامة...';}
function sendM(){let t=minp.value.trim(); if(!t)return; let obj={name:myName,text:t,type:'text',time:Date.now()}; if(privateTo) obj.to=privateTo; msgRef.push(obj); minp.value=''; if(privateTo) setTab('private');}
imgInput.onchange=()=>{let f=imgInput.files[0]; if(!f)return; let r=storage.ref('img/'+Date.now()+'_'+f.name); r.put(f).then(()=>r.getDownloadURL()).then(u=>{let o={name:myName,type:'image',text:u,time:Date.now()}; if(privateTo) o.to=privateTo; msgRef.push(o);});}
videoInput.onchange=()=>{let f=videoInput.files[0]; if(!f)return; let r=storage.ref('video/'+Date.now()+'_'+f.name); r.put(f).then(()=>r.getDownloadURL()).then(u=>{let o={name:myName,type:'video',text:u,time:Date.now()}; if(privateTo) o.to=privateTo; msgRef.push(o);});}
fileInput.onchange=()=>{let f=fileInput.files[0]; if(!f)return; let r=storage.ref('files/'+Date.now()+'_'+f.name); r.put(f).then(()=>r.getDownloadURL()).then(u=>{let o={name:myName,type:'file',text:u,fileName:f.name,time:Date.now()}; if(privateTo) o.to=privateTo; msgRef.push(o);});}
function toggleRec(){if(!isRec){navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{mediaRecorder=new MediaRecorder(s); audioChunks=[]; mediaRecorder.ondataavailable=e=>audioChunks.push(e.data); mediaRecorder.onstop=()=>{let b=new Blob(audioChunks,{type:'audio/webm'}); let ref=storage.ref('voice/'+Date.now()+'.webm'); ref.put(b).then(()=>ref.getDownloadURL()).then(url=>{let o={name:myName,type:'voice',text:url,time:Date.now()}; if(privateTo) o.to=privateTo; msgRef.push(o);});}; mediaRecorder.start(); isRec=true; recBtn.innerText='⏹️';});} else{mediaRecorder.stop(); isRec=false; recBtn.innerText='🎤';}}
</script>
</body>
</html>
