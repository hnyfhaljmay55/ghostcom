<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHOSTCOM - Secure</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{
  min-height:100vh;
  background: #000 url('bg.jpg') no-repeat center center fixed;
  background-size: cover;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
body::before{
  content:'';
  position:absolute;inset:0;
  background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%);
}
.container{
  position:relative;z-index:2;
  width:90%;max-width:360px;
  text-align:center;
}
.title{
  font-size:38px;font-weight:800;color:#fff;
  text-shadow: 0 0 15px #a855f7, 0 0 30px #a855f7;
  margin-bottom:5px;
}
.subtitle{
  color:#c9b3ff;font-size:14px;
  background: rgba(0,0,0,0.6);
  display:inline-block;padding:4px 12px;border-radius:20px;
  border:1px solid rgba(168,85,247,0.3);
  margin-bottom:25px;
}
.neon-box{
  background: rgba(0,0,0,0.85);
  border: 1.5px solid #ff3b9a;
  border-radius:18px;
  padding:14px 18px;
  margin-bottom:18px;
  box-shadow: 0 0 10px rgba(255,59,154,0.6), 0 0 25px rgba(255,59,154,0.3), inset 0 0 10px rgba(255,59,154,0.15);
  position:relative;
  overflow:hidden;
}
.neon-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background: linear-gradient(90deg, transparent, #00ffff, #ff3b9a, transparent);
}
.neon-box.welcome{
  border-color:#ff8bd1;
  box-shadow: 0 0 15px rgba(255,100,180,0.7);
}
.neon-box.welcome span{
  font-size:26px;font-weight:800;
  color:#fff;
  text-shadow: 0 0 10px #ff3b9a;
}
.neon-input{
  width:100%;
  background:transparent;
  border:none;
  outline:none;
  color:#fff;
  font-size:18px;
  font-weight:600;
  text-align:center;
}
.neon-input::placeholder{color:#ff8bd1;opacity:0.9}
.icon{font-size:22px;margin-left:8px;vertical-align:middle;filter: drop-shadow(0 0 5px #a855f7)}
.btn-box{
  background: linear-gradient(90deg, #0a0a0a, #1a1a1a);
  border:1.5px solid #ff3b9a;
  border-radius:18px;
  padding:14px;
  margin-top:10px;
  cursor:pointer;
  box-shadow: 0 0 15px rgba(255,59,154,0.6);
  transition:0.3s;
}
.btn-box:active{transform:scale(0.97);box-shadow:0 0 25px #ff3b9a}
.btn-text{
  color:#fff;font-size:22px;font-weight:800;
  text-shadow:0 0 10px #ff3b9a;
}
.footer{
  margin-top:20px;color:#aaa;font-size:11px;
}
</style>
</head>
<body>
<div class="container">
  <div class="title">🔒🛡️ أهلاً بك</div>
  <div class="subtitle">لوحة التحقق الآمن - سيبر سيكيورتي</div>

  <div class="neon-box welcome">
    <span>👋 نورت ياغالي ✨</span>
  </div>

  <div class="neon-box">
    <span class="icon">👤</span>
    <input id="username" class="neon-input" placeholder="حط اليوزر">
  </div>

  <div class="neon-box">
    <span class="icon">⌨️</span>
    <input id="code" class="neon-input" placeholder="حط الكود GHOST-XXXX" type="password">
  </div>

  <div class="neon-box btn-box" onclick="login()">
    <div class="btn-text">✅ اتحقق</div>
  </div>

  <div class="footer">حماية مشفرة • لا تشارك كودك مع أحد • نأسف لأجلك</div>
</div>

<script>
function login(){
  const u = document.getElementById('username').value.trim();
  const c = document.getElementById('code').value.trim();
  if(!u || !c){ alert('ياغالي حط اليوزر والكود 😅'); return; }
  localStorage.setItem('ghost_user', u);
  localStorage.setItem('ghost_code', c);
  window.location.href = 'chat.html';
}
</script>
</body>
</html>
