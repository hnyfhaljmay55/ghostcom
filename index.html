<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHOSTCOM - عربي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#060610;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center}
.neon{background:rgba(15,10,40,0.9);border:1.5px solid #2a2a5a;border-radius:28px;padding:28px 22px;width:93%;max-width:400px;box-shadow:0 0 40px rgba(123,62,255,0.3)}
.logo{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:20px}
.logo b{font-size:22px;text-shadow:0 0 10px #00d9ff}
.lab{font-size:11px;color:#00d9ff;margin:16px 0 6px;text-align:right}
.inp{width:100%;background:#0a0a1a;border:1.5px solid #3a3a6a;border-radius:14px;padding:14px;color:#fff;text-align:center;outline:none}
.btn{width:100%;background:linear-gradient(90deg,#7b3eff,#00d4ff);border:none;border-radius:30px;padding:14px;font-weight:800;color:#fff;margin-top:18px;cursor:pointer}
.info{margin-top:14px;background:#0006;border-radius:12px;padding:10px;font-size:11px;text-align:center;color:#8a8ab0}
.dev{display:none}
.card{background:#0008;border:1px solid #3a2a6a;border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between}
.card span{font-family:monospace;color:#00ff88;font-weight:700}
.badge{background:#00ff88;color:#000;font-size:10px;padding:3px 8px;border-radius:20px}
.badge.burn{background:#ff3a5a;color:#fff}
.btn-p{background:linear-gradient(90deg,#7b3eff,#b03eff);margin:8px 0}
.btn-g{background:linear-gradient(90deg,#00c87a,#00e0a0);color:#000;margin:8px 0}
.chat{display:none;position:fixed;inset:0;background:#080818;flex-direction:column}
.head{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:12px;margin:10px;border:1.5px solid #00e5ff44;border-radius:18px;background:rgba(10,15,35,0.9)}
.msgs{position:relative;z-index:2;flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.m{max-width:80%;padding:11px 13px;border-radius:16px;font-size:13.5px}
.in{align-self:flex-start;background:rgba(20,40,60,0.85);border:1px solid #00d9ff44;color:#cfe8ff}
.out{align-self:flex-end;background:rgba(60,20,80,0.75);border:1px solid #ff00aa44;color:#ffe0f0}
.input-bar{position:relative;z-index:2;display:flex;gap:8px;padding:10px;margin:10px;border:1.5px solid #00e5ff44;border-radius:30px;background:rgba(10,10,30,0.9)}
.input-bar input{flex:1;background:transparent;border:none;outline:none;color:#fff}
</style>
</head>
<body>
<div id="login" class="neon">
<div class="logo"><span style="font-size:11px;color:#7ab8ff">قناة آمنة - تسجيل دخول</span><b>GHOSTCOM</b><span>👻</span></div>
<div class="lab">اسمك - YOUR NAME</div><input id="uname" class="inp" placeholder="اكتب اسمك">
<div class="lab">كود الدعوة المختلط - INVITE CODE</div><input id="icode" class="inp" placeholder="GHOST-XXXX-XXXX">
<div class="lab">رقم الغرفة - ROOM NUMBER</div><input class="inp" value="GHOST-IBB-YE" readonly>
<button class="btn" onclick="enterG()">دخول GHOSTCOM - ENTER</button>
<div class="info">كود المالك: <b style="color:#00d9ff">DEV-X9K2-ADMIN</b><br>كل كود مخلط يستخدم مرة واحدة وينحرق 🔥</div>
</div>

<div id="dev" class="neon dev">
<div class="logo"><b>GHOSTCOM 👑 لوحة المالك</b></div>
<button class="btn btn-p" onclick="gen()">+ توليد كود مخلط جديد</button>
<button class="btn btn-g" onclick="share()">📤 مشاركة آخر كود</button>
<div id="list"></div>
<button class="btn" style="background:#222" onclick="back()">رجوع ←</button>
</div>

<div id="chat" class="chat">
<div class="head"><div style="display:flex;gap:10px;align-items:center"><span onclick="back()">←</span><div>🥷</div><div><div style="font-weight:700">وحدة ألفا | الدعم التقني</div><div style="font-size:11px;color:#00ff88">متصل الآن</div></div></div></div>
<div class="msgs" id="msgs">
<div class="m in">مرحبا، هل جهزت ملفات المشروع؟</div>
<div class="m out">أكيد، رفعت الصور والفيديو الآن</div>
</div>
<div class="input-bar"><input id="minp" placeholder="اكتب رسالة..."><button style="width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#ff00aa,#7b3eff);border:none;color:#fff" onclick="sendM()">◁</button></div>
</div>

<script>
let codes=JSON.parse(localStorage.getItem('ghost_codes')||'[]');let last=localStorage.getItem('ghost_last')||'GHOST-DEMO-2026';
if(codes.length==0){codes=[{code:'GHOST-DEMO-2026',s:'متاح'},{code:'GHOST-334Y-8PAU',s:'متاح'}]}
function enterG(){
let n=document.getElementById('uname').value.trim();let c=document.getElementById('icode').value.trim().toUpperCase();
if(c==='DEV-X9K2-ADMIN'){document.getElementById('login').style.display='none';document.getElementById('dev').style.display='block';render();return}
let f=codes.find(x=>x.code===c);if(!f){alert('الكود غير صحيح');return}if(f.s!=='متاح'){alert('الكود محروق 🔥');return}
f.s='محروق 🔥';localStorage.setItem('ghost_codes',JSON.stringify(codes));document.getElementById('login').style.display='none';document.getElementById('chat').style.display='flex';
}
function gen(){let ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let a='',b='';for(let i=0;i<4;i++)a+=ch[Math.floor(Math.random()*ch.length)];for(let i=0;i<4;i++)b+=ch[Math.floor(Math.random()*ch.length)];let nc='GHOST-'+a+'-'+b;codes.unshift({code:nc,s:'متاح'});last=nc;localStorage.setItem('ghost_codes',JSON.stringify(codes));localStorage.setItem('ghost_last',nc);render()}
function render(){let h='';codes.forEach(x=>{h+=`<div class=card><span>${x.code}</span><span class="badge ${x.s==='متاح'?'':'burn'}">${x.s}</span></div>`});document.getElementById('list').innerHTML=h}
function share(){navigator.clipboard.writeText(last);alert('تم نسخ: '+last)}
function back(){document.getElementById('dev').style.display='none';document.getElementById('chat').style.display='none';document.getElementById('login').style.display='block'}
function sendM(){let i=document.getElementById('minp');if(!i.value.trim())return;let d=document.createElement('div');d.className='m out';d.innerText=i.value;document.getElementById('msgs').appendChild(d);i.value=''}
render();
</script>
</body>
</html>
