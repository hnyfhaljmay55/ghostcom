<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHOSTCOM - دخول</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0f;font-family:system-ui;color:#fff}
.card{width:92%;max-width:380px;background:#15151f;border:1px solid #8a2be2;border-radius:20px;padding:25px;box-shadow:0 0 30px rgba(138,43,226,.3)}
h1{text-align:center;color:#a855f7;margin:0 0 5px}
.room{text-align:center;background:#000;border-radius:10px;padding:8px;margin:15px 0;border:1px dashed #8a2be2;letter-spacing:2px}
input{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#0f0f18;color:#fff;outline:none}
input:focus{border-color:#a855f7}
button{width:100%;padding:13px;margin-top:12px;border:none;border-radius:10px;background:linear-gradient(90deg,#8a2be2,#a855f7);color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
#msg{text-align:center;margin-top:12px;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h1>👻 GHOSTCOM</h1>
<div class="room">GHOST-IBB-YE</div>
<input id="name" placeholder="الاسم">
<input id="code" placeholder="حط كود الاشتراك GHOST-XXXX">
<button onclick="login()">دخول الغرفة</button>
<div id="msg"></div>
</div>
<script>
function login(){
  const name = document.getElementById('name').value.trim();
  const code = document.getElementById('code').value.trim().toUpperCase();
  const msg = document.getElementById('msg');
  const codes = JSON.parse(localStorage.getItem('ghost_codes') || '[]');
  if(!name || !code){msg.style.color='#ff6b6b';msg.textContent='عبي الاسم والكود';return;}
  if(codes.includes(code) || code.startsWith('GHOST-')){
     msg.style.color='#22c55e';msg.textContent='تم الدخول يا '+name+' .. جاري التحويل';
     setTimeout(()=>{msg.textContent='مرحبا بك في غرفة GHOST-IBB-YE';},1000);
  } else {
     msg.style.color='#ff6b6b';msg.textContent='الكود غلط او منتهي';
  }
}
</script>
</body>
</html>
