<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHOSTCOM HQ - السفاح</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#050508;color:#fff}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at top,#1a0b2e,#0a0a14 70%,#050508);z-index:-1}
.neon{border:1px solid #a855ff;box-shadow:0 0 18px rgba(168,85,255,.35);background:linear-gradient(135deg,rgba(25,15,45,.9),rgba(15,10,30,.95));border-radius:16px}
.card{padding:16px;margin:10px;border-radius:16px;cursor:pointer}
.screen{display:none;height:100vh;overflow-y:auto;padding-bottom:90px}
.screen.active{display:block}
.input{width:100%;padding:16px;background:rgba(15,10,30,.9);border:1px solid #a855ff;border-radius:14px;color:#fff;outline:none;margin:7px 0;font-size:16px}
.btn{background:linear-gradient(90deg,#a855ff,#7c3aed);border:none;padding:15px;border-radius:14px;color:#fff;font-weight:900;width:100%;cursor:pointer;margin-top:10px;box-shadow:0 0 22px rgba(168,85,255,.5)}
.bottom{position:fixed;bottom:12px;left:12px;right:12px;background:rgba(15,10,30,.97);border:1px solid #a855ff;border-radius:22px;display:flex;justify-content:space-around;padding:8px;z-index:99}
.b-item{padding:10px 12px;border-radius:14px;color:#666;text-align:center;flex:1;font-size:12px;cursor:pointer}
.b-item.active{background:linear-gradient(90deg,#a855ff,#7c3aed);color:#fff}
.msg{max-width:82%;padding:11px 15px;border-radius:18px;margin:6px 10px;font-size:14px;word-break:break-word;line-height:1.5}
.msg.me{background:linear-gradient(90deg,#a855ff,#7c3aed);align-self:flex-end;margin-left:auto;border-bottom-right-radius:4px}
.msg.other{background:rgba(30,18,55,.95);border:1px solid #2a1a45;align-self:flex-start;border-bottom-left-radius:4px}
.msg img,.msg video{max-width:100%;border-radius:12px;margin-top:8px;display:block}
.msg audio{width:220px;margin-top:6px}
.chatArea{display:flex;flex-direction:column;height:calc(100vh - 210px);overflow-y:auto;padding:10px}
.bar{position:fixed;bottom:78px;left:10px;right:10px;display:flex;gap:7px;align-items:center;background:rgba(15,10,30,.98);padding:8px 10px;border-radius:28px;border:1px solid #333;z-index:98}
.bar input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:15px;padding:8px}
.iconBtn{width:42px;height:42px;border-radius:50%;background:rgba(168,85,255,.18);border:1px solid #a855ff;color:#a855ff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex-shrink:0}
.iconBtn.send{background:linear-gradient(90deg,#a855ff,#7c3aed);color:#fff;border:none}
</style>
</head>
<body>
<div class="bg"></div>

<div id="sc-login" class="screen active">
<div style="padding:20px">
<div class="neon" style="padding:14px;text-align:center">
<div style="color:#e9d5ff;font-weight:900;font-size:20px">GHOSTCOM HQ 🔥</div>
<div style="color:#4ade80;font-size:12px">● السيرفر المؤقت شغال - يربطك مع اصدقائك</div>
</div>
<div style="margin-top:20px">
<div class="neon card">👤<input id="inpName" class="input" style="border:none;background:transparent;margin:0" placeholder="اكتب اسمك"></div>
<div class="neon card">🔑<input id="inpCode" class="input" style="border:none;background:transparent;margin:0" placeholder="حط كود الاشتراك"></div>
<button class="btn" onclick="login()">دخول آمن 🔒</button>
<div style="text-align:center;margin-top:12px;color:#666;font-size:11px">ادمن: <b style="color:#a855ff">ADMIN123</b> • صديق: <b style="color:#a855ff">SAFFAH</b></div>
</div>
</div>
</div>

<div id="sc-admin" class="screen">
<div class="neon" style="margin:12px;padding:12px;text-align:center">
<div style="font-weight:900;color:#e9d5ff">لوحة تحكم المطور السرية</div>
<div style="font-size:11px;color:#4ade80">● ONLINE</div>
</div>
<div style="padding:10px">
<div id="codesList"></div>
<div style="display:flex;gap:6px;margin-top:10px"><input id="inpNewCode" class="input" placeholder="كود جديد"><button class="btn" style="width:80px;margin:0" onclick="addCode()">+</button></div>
<button class="btn" onclick="genCode()">➕ توليد كود</button>
<button class="btn" style="background:rgba(255,255,255,.06);border:1px solid #a855ff" onclick="copyInvite()">📤 نسخ دعوة</button>
</div>
</div>

<div id="sc-sec" class="screen">
<div style="padding:20px"><h1>مركز الحماية</h1><p style="color:#4ade80">● متصل</p></div>
<div class="neon card" onclick="openChat('الجروب')">🏴‍☠️ الجروب ›</div>
<div style="padding:10px"><button class="btn" onclick="openChat('الجروب')">🚀 دخول الشات</button></div>
</div>

<div id="sc-chat" class="screen">
<div class="neon" style="margin:0;border-radius:0;padding:10px 14px;display:flex;justify-content:space-between"><span onclick="showScr('sec')">‹</span><div id="chatTitle">الجروب</div><div style="color:#4ade80">● LIVE</div></div>
<div id="chatBox" class="chatArea"></div>
<div class="bar">
<label class="iconBtn" for="fileInp">+</label><input type="file" id="fileInp" hidden accept="image/*,video/*,.pdf,.zip" onchange="sendFile(this)">
<label class="iconBtn" for="imgInp">📷</label><input type="file" id="imgInp" hidden accept="image/*,video/*" onchange="sendFile(this)">
<input id="txtInp" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter')sendText()">
<div class="iconBtn" onclick="toggleRec()">🎤</div><button class="iconBtn send" onclick="sendText()">➤</button>
</div>
<div id="recBar" style="display:none;position:fixed;bottom:78px;left:10px;right:10px;background:#1a0b2e;border:1px solid #ff3333;border-radius:28px;padding:10px 16px;justify-content:space-between;align-items:center;z-index:99"><div><span id="recTime">00:00</span> • تسجيل...</div><div style="display:flex;gap:8px"><button class="iconBtn" style="background:#222;border:none;color:#fff" onclick="cancelRec()">✕</button><button class="iconBtn send" onclick="stopRec()">✓</button></div></div>
</div>

<div class="bottom" id="nav" style="display:none">
<div class="b-item" onclick="showScr('sec')">🏠<br>الرئيسية</div>
<div class="b-item" onclick="showScr('admin')">🔒<br>التحكم</div>
<div class="b-item active" onclick="showScr('chat')">💬<br>الشات</div>
<div class="b-item" onclick="showScr('login')">👤<br>حسابي</div>
</div>

<script>
const TOPIC="ghostcom-saffah-7117337861-2026";
const NTFY_URL="https://ntfy.sh/"+TOPIC;
let codes=JSON.parse(localStorage.getItem('ghost_codes_final')||'["SAFFAH","FRIEND1"]');
let myName=localStorage.getItem('ghost_name')||'السفاح';
let ADMIN="ADMIN123";
let mediaRecorder,audioChunks=[],recTimer,recSec=0,chatInited=false,seenIds=new Set();
function login(){
 let n=document.getElementById('inpName').value.trim()||'السفاح';
 let c=document.getElementById('inpCode').value.trim().toUpperCase();
 if(!c){alert('حط الكود!');return}
 myName=n;localStorage.setItem('ghost_name',n);
 if(c===ADMIN){showScr('admin');renderCodes();return}
 if(!codes.includes(c)){alert('كود غلط! '+codes.join(','));return}
 showScr('sec');
}
function showScr(s){
 document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
 document.querySelectorAll('.b-item').forEach(x=>x.classList.remove('active'));
 if(s==='login'){document.getElementById('sc-login').classList.add('active');document.getElementById('nav').style.display='none'}
 if(s==='admin'){document.getElementById('sc-admin').classList.add('active');document.querySelectorAll('.b-item')[1].classList.add('active');renderCodes();document.getElementById('nav').style.display='flex'}
 if(s==='sec'){document.getElementById('sc-sec').classList.add('active');document.querySelectorAll('.b-item')[0].classList.add('active');document.getElementById('nav').style.display='flex'}
 if(s==='chat'){document.getElementById('sc-chat').classList.add('active');document.querySelectorAll('.b-item')[2].classList.add('active');document.getElementById('nav').style.display='flex'}
}
function openChat(t){document.getElementById('chatTitle').innerText=t;showScr('chat');initChat()}
function renderCodes(){
 let list=document.getElementById('codesList');list.innerHTML='';
 codes.forEach((c,i)=>{list.innerHTML+=`<div class="neon" style="display:flex;justify-content:space-between;padding:10px;margin:6px 0"><b>${c}</b><span><button onclick="copyT('${c}')" style="background:#222;color:#fff;border:none;padding:6px 10px;border-radius:8px">نسخ</button><button onclick="delC(${i})" style="background:#f33;color:#fff;border:none;padding:6px 10px;border-radius:8px">حذف</button></span></div>`});
}
function genCode(){let c='SAFFAH'+Math.floor(Math.random()*9000+1000);codes.push(c);localStorage.setItem('ghost_codes_final',JSON.stringify(codes));renderCodes();alert('كود: '+c)}
function addCode(){let v=document.getElementById('inpNewCode').value.trim().toUpperCase();if(!v)return;codes.push(v);localStorage.setItem('ghost_codes_final',JSON.stringify(codes));document.getElementById('inpNewCode').value='';renderCodes()}
function delC(i){codes.splice(i,1);localStorage.setItem('ghost_codes_final',JSON.stringify(codes));renderCodes()}
function copyT(t){navigator.clipboard.writeText(t);alert('نسخ: '+t)}
function copyInvite(){let txt=`👑 GHOSTCOM HQ\nhttps://hnyfhaljmay55.github.io/ghostcom/\nاكواد: ${codes.join(' , ')}\nادمن: ADMIN123`;navigator.clipboard.writeText(txt);alert(txt)}
function initChat(){
 if(chatInited)return;chatInited=true;
 let box=document.getElementById('chatBox');
 box.innerHTML=`<div class="msg other">✅ متصل بالسيرفر المؤقت! كل رسالة بيشوفها صديقك فوراً 🔥</div>`;
 try{
   let es=new EventSource(NTFY_URL+"/sse");
   es.onmessage=e=>{
     try{
       let m=JSON.parse(e.data);
       if(!m.id||seenIds.has(m.id))return;
       seenIds.add(m.id);
       if(m.name===myName)return;
       addUI(m.name,m.text,m.type,m.data,false);
     }catch{}
   };
 }catch(e){}
}
function addUI(name,text,type,data,isMe){
 let box=document.getElementById('chatBox');
 let div=document.createElement('div');div.className='msg '+(isMe?'me':'other');
 let time=new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});
 let c=`<div style="font-size:10px;opacity:.6">${name} • ${time}</div>`;
 if(type==='text')c+=`<div>${text}</div>`;
 if(type==='image')c+=`<div>${text}</div><img src="${data}">`;
 if(type==='video')c+=`<div>${text}</div><video src="${data}" controls></video>`;
 if(type==='audio')c+=`<div>🎤</div><audio src="${data}" controls></audio>`;
 if(type==='file')c+=`<div>📎 ${text}</div><a href="${data}" download="${text}" style="color:#0ff">تحميل</a>`;
 div.innerHTML=c;box.appendChild(div);box.scrollTop=box.scrollHeight;
}
function pushMsg(m){
 m.id=Date.now()+'-'+Math.random().toString(36).substr(2,5);
 addUI(m.name,m.text,m.type,m.data,true);
 fetch(NTFY_URL,{method:'POST',body:JSON.stringify(m),headers:{'Title':'GHOSTCOM '+m.name}}).catch(()=>{});
}
function sendText(){let inp=document.getElementById('txtInp');let txt=inp.value.trim();if(!txt)return;pushMsg({name:myName,text:txt,type:'text',data:'',ts:Date.now()});inp.value='';}
function sendFile(el){
 let file=el.files[0];if(!file)return;
 if(file.size>4*1024*1024){alert('أقل من 4 ميجا');return}
 let reader=new FileReader();
 reader.onload=e=>{
   let data=e.target.result;
   let type=file.type.startsWith('image/')?'image':file.type.startsWith('video/')?'video':'file';
   pushMsg({name:myName,text:file.name,type:type,data:data,ts:Date.now()});
 };
 reader.readAsDataURL(file);el.value='';
}
function toggleRec(){if(mediaRecorder&&mediaRecorder.state==='recording'){stopRec();return}startRec()}
async function startRec(){
 try{
   let stream=await navigator.mediaDevices.getUserMedia({audio:true});
   mediaRecorder=new MediaRecorder(stream);audioChunks=[];recSec=0;
   mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
   mediaRecorder.onstop=()=>{
     let blob=new Blob(audioChunks,{type:'audio/webm'});
     let reader=new FileReader();reader.onload=e=>{pushMsg({name:myName,text:'صوتية',type:'audio',data:e.target.result,ts:Date.now()})};reader.readAsDataURL(blob);
     stream.getTracks().forEach(t=>t.stop());
   };
   mediaRecorder.start();document.getElementById('recBar').style.display='flex';
   recTimer=setInterval(()=>{recSec++;let m=String(Math.floor(recSec/60)).padStart(2,'0');let s=String(recSec%60).padStart(2,'0');document.getElementById('recTime').innerText=m+':'+s},1000);
 }catch(e){alert('المايك: '+e.message)}
}
function stopRec(){if(mediaRecorder){mediaRecorder.stop();clearInterval(recTimer);document.getElementById('recBar').style.display='none'}}
function cancelRec(){if(mediaRecorder){try{mediaRecorder.stop()}catch{}mediaRecorder=null}clearInterval(recTimer);document.getElementById('recBar').style.display='none'}
</script>
</body>
  </html>
