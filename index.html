<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الأمن السيبراني</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap');
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;min-height:100vh;background:#000 url('bg.jpg') center/cover no-repeat fixed;display:flex;justify-content:center;align-items:center;padding:12px}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.55)}
.wrap{position:relative;z-index:2;width:100%;max-width:380px}
.h1{text-align:center;font-size:36px;font-weight:900;background:linear-gradient(90deg,#ff00e5,#00f2ff,#ffe600);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 15px #a855f7);margin:0 0 15px}
.house{background:rgba(255,255,255,.09);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:14px;margin-bottom:11px;text-align:center}
.house b{color:#e9d5ff;text-shadow:0 0 10px #a855f7;font-size:14px}
input{width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(10,15,30,.9);color:#fff;text-align:center}
button{width:100%;margin-top:8px;padding:12px;border-radius:12px;border:none;font-weight:900;color:#fff;cursor:pointer}
.c1{border-color:#ff00ff} .c2{border-color:#00ffff} .c3{border-color:#ffcc00} .c4{border-color:#00ff99}
.b1{background:linear-gradient(90deg,#ff7a00,#ff00a0)} .b2{background:linear-gradient(90deg,#00ff99,#00ccff)}
#msg{font-size:12px;margin-top:6px;min-height:14px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
<h1 class="h1">الأمن السيبراني</h1>

<div class="house c1"><b>✨ اسمك ✨</b><input id="n" value="Specter_00"></div>
<div class="house c2"><b>🔑 حط الكود الاشتراك 🔑</b><input id="c" placeholder="GHOST-XXXX"></div>
<div class="house c3"><b>🔍 الرجاء اتحقق 🔍</b><button class="b1" onclick="v()">الرجاء التحقق</button><div id="msg"></div></div>
<div class="house c4"><b>🛡️ انت الان امن للامن السيبراني 🛡️</b><button class="b2" onclick="go()">ENTER GHOSTCOM</button></div>
<div class="house">المطور<br><b style="direction:ltr">+967717337861</b></div>

</div>
<script>
let ok=false;
function v(){
 let code=document.getElementById('c').value.trim().toUpperCase();
 let name=document.getElementById('n').value.trim()||'Guest';
 let m=document.getElementById('msg');
 if(!code.startsWith('GHOST-')){m.innerHTML='<span style=color:#ff7a7a>اكتب كود GHOST-</span>';ok=false;return;}
 let used=JSON.parse(localStorage.getItem('ghost_used_codes')||'[]');
 if(used.includes(code)){m.innerHTML='<span style=color:#ff7a7a>الكود مستخدم</span>';ok=false;return;}
 localStorage.setItem('ghost_session',JSON.stringify({name:name,code:code}));
 localStorage.setItem('ghost_temp',code);
 m.innerHTML='<span style=color:#4ade80>✅ تم التحقق</span>';ok=true;
}
function go(){if(!ok)v();if(!ok)return;let code=localStorage.getItem('ghost_temp');let u=JSON.parse(localStorage.getItem('ghost_used_codes')||'[]');u.push(code);localStorage.setItem('ghost_used_codes',JSON.stringify(u));location.href='home.html';}
</script>
</body>
</html>
