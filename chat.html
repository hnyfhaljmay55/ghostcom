<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الدردشة - GHOSTCOM</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;background:#000 url('bg3.jpg') center/cover fixed no-repeat;font-family:Cairo;color:#fff;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,.6)}
.top,.chat,.bottom{position:relative;z-index:1}
.top{padding:10px 14px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);backdrop-filter:blur(20px);border-bottom:1px solid rgba(168,85,247,.4)}
.back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(255,255,255,.12);cursor:pointer}
.chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:82%;padding:10px 14px;border-radius:16px;font-size:13px;backdrop-filter:blur(12px)}
.me{align-self:flex-start;background:linear-gradient(135deg,#7c3aed,#5b21b6);border:1px solid #a855f7;border-radius:16px 16px 2px 16px}
.other{align-self:flex-end;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:16px 16px 16px 2px}
.bottom{padding:10px;display:flex;gap:8px;background:rgba(0,0,0,.6);backdrop-filter:blur(20px);border-top:1px solid rgba(168,85,247,.3)}
input{flex:1;padding:12px;border-radius:12px;border:1px solid rgba(168,85,247,.4);background:rgba(0,0,0,.5);color:#fff;outline:none}
button{padding:12px 18px;border:none;border-radius:12px;background:linear-gradient(90deg,#7c3aed,#06b6d4);color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="top"><div class="back" onclick="location.href='home.html'">‹</div><div><b>الحماية للأمن السيبراني</b><div style="font-size:10px;color:#86efac">• 12K عضو نشط</div></div></div>
<div class="chat" id="chat"><div class="m other">مرحبا بكم في جروب الحماية 👻</div></div>
<div class="bottom"><input id="inp" placeholder="اكتب رسالة مشفرة..."><button onclick="send()">إرسال</button></div>
<script>
function add(t,me){let d=document.createElement('div');d.className='m '+(me?'me':'other');d.textContent=t;document.getElementById('chat').appendChild(d);document.getElementById('chat').scrollTop=99999;}
function send(){let v=document.getElementById('inp').value.trim();if(!v)return;add(v,true);document.getElementById('inp').value='';setTimeout(()=>add('تم الاستلام 👻',false),800);}
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
