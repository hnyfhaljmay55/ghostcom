<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHOSTCOM - CHAT</title>
<style>
*{box-sizing:border-box;font-family:Tahoma}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:#020617 url('bg.jpg') center/cover fixed;color:#fff}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);border-bottom:1px solid #a855f7}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,.6)}
.bubble{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4}
.me{align-self:flex-end;background:linear-gradient(90deg,#7c3aed,#06b6d4);border-bottom-left-radius:4px}
.other{align-self:flex-start;background:rgba(255,255,255,.12);border-bottom-right-radius:4px}
.input-area{display:flex;gap:8px;padding:10px;background:rgba(0,0,0,.85);border-top:1px solid #a855f7}
input{flex:1;padding:12px;border-radius:20px;border:1px solid #334155;background:#0f172a;color:#fff;outline:none}
button{padding:12px 16px;border-radius:20px;border:none;font-weight:800;cursor:pointer}
.send{background:linear-gradient(90deg,#22c55e,#06b6d4);color:#fff}
.back{background:#1e293b;color:#fff}
.small{font-size:10px;opacity:.6;margin-top:3px}
</style>
</head>
<body>
<div class="header">
<button class="back" onclick="location.href='home.html'">⬅️ البيوت</button>
<div id="roomTitle">البيت العام</div>
<div id="myName" style="color:#a78bfa"></div>
</div>

<div id="msgs" class="msgs"></div>

<div class="input-area">
<input id="txt" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter')send()">
<button class="send" onclick="send()">إرسال</button>
</div>

<script>
let session=JSON.parse(localStorage.getItem('ghost_session')||'null');
if(!session) location.href='index.html';
document.getElementById('myName').innerText=session.name;

let params=new URLSearchParams(location.search);
let room=params.get('room')||localStorage.getItem('ghost_room')||'general';
let titles={general:'البيت الأحمر - العام',secret:'البيت الأزرق - السري',files:'البيت الأخضر - الملفات'};
document.getElementById('roomTitle').innerText=titles[room]||room;

let key='ghost_messages_'+room;

function load(){
 let data=JSON.parse(localStorage.getItem(key)||'[]');
 let box=document.getElementById('msgs');
 box.innerHTML='';
 data.forEach(m=>{
   let div=document.createElement('div');
   div.className='bubble '+(m.name===session.name?'me':'other');
   div.innerHTML=`<b>${m.name}</b><br>${m.text}<div class="small">${m.time}</div>`;
   box.appendChild(div);
 });
 box.scrollTop=box.scrollHeight;
}

function send(){
 let input=document.getElementById('txt');
 let text=input.value.trim();
 if(!text) return;
 let data=JSON.parse(localStorage.getItem(key)||'[]');
 data.push({name:session.name,text:text,time:new Date().toLocaleTimeString()});
 // نحتفظ بآخر 100 رسالة فقط
 if(data.length>100) data=data.slice(-100);
 localStorage.setItem(key,JSON.stringify(data));
 input.value='';
 load();
 // محاكاة رد صديقك لو على نفس الجهاز - للاختبار
 // للمزامنة بين الأجهزة الحقيقية نحتاج Firebase وسأركبه لك في الخطوة القادمة
}

load();

// تحديث تلقائي كل ثانية عشان لو صديقك أرسل رسالة من نفس المتصفح
setInterval(load,1000);

// تنبيه للمستخدم
if(!localStorage.getItem('ghost_chat_notice')){
 alert('ملاحظة: هذه الدردشة تحفظ الرسائل على نفس الجهاز. عشان تراسل أصدقائك من أجهزة مختلفة، قل لي "ركب الفايربيس" وأنا أركب لك دردشة لحظية حقيقية تشتغل بين كل الأجهزة بدون حفظ على جهازك فقط.');
 localStorage.setItem('ghost_chat_notice','1');
}
</script>
</body>
</html>
