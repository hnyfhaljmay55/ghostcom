<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHOSTCOM - Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;display:flex;flex-direction:column;background:#000 url('bg3.jpg') center/cover no-repeat;font-family:'Space Grotesk';color:#fff;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,.55)}
.top,.chat,.bottom{position:relative;z-index:2}
.top{padding:12px 16px;display:flex;gap:10px;align-items:center;background:rgba(18,22,35,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(168,85,247,.4)}
.chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;padding:10px 14px;border-radius:16px;font-size:13px}
.me{align-self:flex-start;background:linear-gradient(135deg,#7c3aed,#5b21b6);border:1px solid #a855f7}
.other{align-self:flex-end;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.bottom{padding:10px;display:flex;gap:8px;background:rgba(18,22,35,.9);backdrop-filter:blur(18px);border-top:1px solid rgba(168,85,247,.3)}
input{flex:1;padding:12px;border-radius:12px;border:1px solid rgba(168,85,247,.4);background:rgba(0,0,0,.5);color:#fff;outline:none}
button{padding:12px 18px;border:none;border-radius:12px;background:linear-gradient(90deg,#7c3aed,#06b6d4);color:#fff;font-weight:700}
</style>
</head>
<body>
<div class="top"><div onclick="location.href='home.html'" style="cursor:pointer">‹</div><div><b style="font-size:13px">الحماية للأمن السيبراني</b><div style="font-size:10px;color:#86efac">12K عضو نشط</div></div></div>
<div class="chat" id="chat"><div class="m other">مرحبا بكم في جروب الحماية 👻</div></div>
<div class="bottom"><input id="inp" placeholder="اكتب رسالة مشفرة..."><button onclick="send()">إرسال</button></div>
<script>
function send(){let v=document.getElementById('inp').value.trim();if(!v)return;let d=document.createElement('div');d.className='m me';d.textContent=v;document.getElementById('chat').appendChild(d);document.getElementById('inp').value='';document.getElementById('chat').scrollTop=9999;}
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
