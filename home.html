<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHOSTCOM - HOME</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;min-height:100vh;background:#020617;color:#fff;padding:15px}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;background:rgba(255,255,255,.05);border-radius:16px;border:1px solid rgba(168,85,247,.3);margin-bottom:15px}
.grid{display:grid;grid-template-columns:1fr;gap:15px;max-width:500px;margin:0 auto}
.card{position:relative;height:180px;border-radius:20px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:.3s;display:flex;align-items:flex-end;padding:15px}
.card:hover{transform:scale(1.02);border-color:#a855f7}
.card1{background:linear-gradient(135deg,#7c3aed 0%,#ec4899 100%),url('bg1.jpg');background-size:cover;background-blend-mode:overlay}
.card2{background:linear-gradient(135deg,#06b6d4 0%,#3b82f6 100%),url('bg2.jpg');background-size:cover;background-blend-mode:overlay}
.card3{background:linear-gradient(135deg,#10b981 0%,#f59e0b 100%),url('bg3.jpg');background-size:cover;background-blend-mode:overlay}
.card h2{margin:0;font-size:20px;text-shadow:0 2px 10px #000}
.card p{margin:4px 0 0;font-size:12px;opacity:.9}
.badge{position:absolute;top:12px;left:12px;background:#00000099;padding:4px 10px;border-radius:20px;font-size:11px}
.btn-logout{padding:8px 14px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<div>👻 مرحبا <span id="userName">Specter</span></div>
<button class="btn-logout" onclick="logout()">خروج</button>
</div>

<div class="grid">
<div class="card card1" onclick="openChat('general')">
<div class="badge">🔥 1</div>
<div><h2>البيت الأحمر - العام</h2><p>دردشة عامة مع كل الأصدقاء - نص وصور</p></div>
</div>

<div class="card card2" onclick="openChat('secret')">
<div class="badge">🔒 2</div>
<div><h2>البيت الأزرق - السري</h2><p>دردشة سرية، صوت وفيديو مشفر</p></div>
</div>

<div class="card card3" onclick="openChat('files')">
<div class="badge">📁 3</div>
<div><h2>البيت الأخضر - الملفات</h2><p>إرسال ملفات وصور مشفرة - تحذف تلقائيا</p></div>
</div>
</div>

<script>
// حماية - لازم يكون داخل من index
let session=JSON.parse(localStorage.getItem('ghost_session')||'null');
if(!session){window.location.href='index.html';}
else{document.getElementById('userName').innerText=session.name;}

function openChat(type){
 localStorage.setItem('ghost_room',type);
 window.location.href='chat.html?room='+type;
}
function logout(){
 localStorage.removeItem('ghost_session');
 localStorage.removeItem('ghost_temp_verified');
 window.location.href='index.html';
}
</script>
</body>
</html>
