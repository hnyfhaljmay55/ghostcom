<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المقر - آإَلَأْمـنᬼ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{height:100vh;background:#000;overflow:hidden}
.bg{position:fixed;inset:0;background:url('bg5.jpg') center/cover;filter:brightness(0.45)}
.bg:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(139,92,246,0.18),rgba(0,0,0,0.85))}
.container{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column;padding:18px}
.header{text-align:center;margin-top:10px}
.header h1{color:#fff;font-size:22px;text-shadow:0 0 14px #8a2be2}
.header p{color:#c084fc;font-size:12px;margin-top:4px}
.houses{margin-top:22px;display:flex;flex-direction:column;gap:14px;flex:1;overflow-y:auto}
.house{position:relative;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;backdrop-filter:blur(18px);background:rgba(255,255,255,0.06);border:1px solid rgba(168,85,247,0.35);cursor:pointer}
.house img{width:62px;height:62px;border-radius:50%;object-fit:cover;border:2px solid #a855f7}
.info{flex:1}.info h3{color:#fff;font-size:16px;font-weight:900}.info p{color:#d8b4fe;font-size:11px;margin-top:2px}
.badge{position:absolute;top:-6px;left:-6px;background:#ec4899;color:#fff;font-size:9px;padding:2px 8px;border-radius:10px}
.nav{margin-top:auto;display:flex;gap:8px;padding:12px;background:rgba(255,255,255,0.06);backdrop-filter:blur(16px);border-radius:20px;border:1px solid rgba(255,255,255,0.08)}
.nav-item{flex:1;text-align:center;padding:10px 4px;border-radius:14px;color:#9ca3af;font-size:11px;cursor:pointer}
.nav-item.active{background:rgba(139,92,246,0.3);color:#fff}
</style>
</head>
<body>
<div class="bg"></div>
<div class="container">
<div class="header"><h1>مركز الحماية</h1><p id="welcome">Cyber Security • <span id="uname"></span></p></div>
<div class="houses">
<div class="house" onclick="go('group')"><span class="badge">128 نشط</span><img src="bg3.jpg"><div class="info"><h3>الجروب</h3><p>الدردشة الجماعية • الكل يشوف رسائل الكل</p></div><div style="color:#a855f7">›</div></div>
<div class="house" onclick="go('private')"><span class="badge">مشفر</span><img src="bg4.jpg"><div class="info"><h3>الخاص</h3><p>الرسائل الخاصة • محادثة آمنة</p></div><div style="color:#a855f7">›</div></div>
<div class="house" onclick="go('ai')"><span class="badge">AI • خبير</span><img src="bg2.jpg"><div class="info"><h3>الذكاء الاصطناعي</h3><p>خبير الأمن السيبراني • تحليل التهديدات</p></div><div style="color:#a855f7">›</div></div>
</div>
<div class="nav"><div class="nav-item active">🏠<br>الرئيسية</div><div class="nav-item" onclick="alert('الحماية نشطة')">🛡️<br>حماية</div><div class="nav-item" onclick="alert('لا تنبيهات')">🔔<br>تنبيه</div><div class="nav-item" onclick="logout()">👤<br>خروج</div></div>
</div>
<script>
let name=localStorage.getItem('ghost_name'); if(!name) location.href='index.html';
document.getElementById('uname').textContent=name;
function go(t){localStorage.setItem('ghost_room',t); location.href='chat.html?type='+t;}
function logout(){if(confirm('خروج؟ اسمك يبقى محفوظ')){localStorage.removeItem('ghost_code'); location.href='index.html';}}
</script>
</body>
</html>
