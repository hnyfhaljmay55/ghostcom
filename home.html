<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHOSTCOM - Home</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#000 url('bg2.jpg') center/cover no-repeat;font-family:'Space Grotesk';color:#fff}
body::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,.5)}
.wrap{position:relative;z-index:2;padding:16px;max-width:400px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(18,22,35,.85);backdrop-filter:blur(18px);border:1px solid rgba(168,85,247,.4);border-radius:16px}
.card{margin-top:14px;background:rgba(18,22,35,.85);backdrop-filter:blur(18px);border:1px solid rgba(168,85,247,.35);border-radius:18px;padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.icon{width:52px;height:52px;border-radius:12px;background:rgba(0,0,0,.5);border:1px solid #a855f7;display:flex;align-items:center;justify-content:center;font-size:24px}
.badge{margin-left:auto;font-size:9px;padding:5px 10px;border-radius:20px;border:1px solid #22d3ee;color:#67e8f9;background:rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><span>☰</span><b style="font-family:Orbitron;color:#d8b4fe">الرئيسية</b><span>🔔</span></div>
<div class="card" onclick="location.href='chat.html'"><div class="icon">🔒</div><div><div style="font-weight:700;font-size:13px">الحماية للأمن السيبراني</div><div style="font-size:10px;color:#94a3b8;margin-top:3px">Group 1 • 12K عضو</div></div><div class="badge">ENTER</div></div>
<div class="card"><div class="icon">🤖</div><div><div style="font-weight:700;font-size:13px">Ghost AI</div><div style="font-size:10px;color:#86efac;margin-top:3px">ONLINE • جاهز</div></div></div>
</div>
</body>
</html>
