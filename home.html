<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الرئيسية</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:#000 url('bg2.jpg') center/cover no-repeat;font-family:'Cairo';padding:16px}
h1{text-align:center;font-size:30px;background:linear-gradient(90deg,#f472b6,#60a5fa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:10px 0 18px}
.box{max-width:380px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{padding:18px;border-radius:18px;display:flex;align-items:center;gap:12px;cursor:pointer;backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.2);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.c1{background:linear-gradient(135deg,rgba(124,58,237,.85),rgba(6,182,212,.7))}.c2{background:linear-gradient(135deg,rgba(236,72,153,.85),rgba(251,146,60,.7))}.c3{background:linear-gradient(135deg,rgba(16,185,129,.85),rgba(59,130,246,.7))}
.ic{width:54px;height:54px;border-radius:12px;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:26px}
.t{font-weight:800;color:#fff;font-size:14px}.d{font-size:11px;color:#e2e8f0}
</style></head><body>
<h1>حـمـايـة الـسـيـبـرانـي</h1>
<div class="box">
<div class="card c1" onclick="location.href='chat.html'"><div class="ic">👥</div><div><div class="t">الدردشة الجماعية - جروب واحد</div><div class="d">صوت • فيديو • ملفات • ضحك</div></div></div>
<div class="card c2" onclick="location.href='private.html'"><div class="ic">💬</div><div><div class="t">الخاص - راسل صديقك</div><div class="d">دردشة سرية بين الأعضاء</div></div></div>
<div class="card c3" onclick="location.href='ai.html'"><div class="ic">🤖</div><div><div class="t">ذكاء اصطناعي</div><div class="d">الواجهة الثانية - تحت</div></div></div>
</div>
</body></html>
