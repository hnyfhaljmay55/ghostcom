<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الرئيسية - GHOSTCOM</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&family=Orbitron:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#000 url('bg2.jpg') center/cover fixed no-repeat;font-family:'Cairo',system-ui;color:#fff}
body::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}
.wrap{position:relative;z-index:1;padding:14px 12px 30px}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(255,255,255,.08);backdrop-filter:blur(20px);border:1px solid rgba(168,85,247,.45);border-radius:16px;box-shadow:0 0 25px rgba(139,92,246,.25)}
.card{margin-top:14px;background:rgba(20,18,35,.55);backdrop-filter:blur(22px);border:1px solid rgba(168,85,247,.35);border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:0 0 30px rgba(139,92,246,.2);cursor:pointer;transition:.2s}
.card:active{transform:scale(.98)}
.icon{width:56px;height:56px;border-radius:14px;background:rgba(0,0,0,.4);border:1px solid #a855f7;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.title{font-weight:700;font-size:14px;line-height:1.3}
.sub{font-size:11px;color:#94a3b8;margin-top:4px}
.badge{margin-right:auto;font-size:10px;padding:5px 10px;border-radius:20px;background:rgba(0,0,0,.4);border:1px solid #22d3ee;color:#67e8f9}
.badge2{margin-right:auto;font-size:10px;padding:5px 10px;border-radius:20px;background:rgba(0,0,0,.4);border:1px solid #22c55e;color:#86efac}
.tabs{display:flex;gap:8px;margin-top:14px}
.tab{flex:1;padding:9px;text-align:center;border-radius:12px;font-size:13px;cursor:pointer;border:1px solid rgba(168,85,247,.4)}
.tab.active{background:rgba(168,85,247,.35);color:#fff}
.tab:not(.active){background:transparent;color:#888}
.empty{text-align:center;padding:28px 10px;color:#cbd5e1}
</style>
</head>
<body>
<div class="wrap">
<div class="header"><span>☰</span><b style="font-family:Orbitron;color:#d8b4fe;letter-spacing:1px">الرئيسية</b><span>🔔</span></div>
<div class="card" onclick="location.href='chat.html'">
<div class="icon">🔒</div>
<div><div class="title">الجروب الوحيد - الحماية للأمن السيبراني</div><div class="sub">محمي • 12K عضو • نشط الآن</div></div>
<div class="badge">Group 1</div>
</div>
<div class="card">
<div class="icon">🤖</div>
<div><div class="title">الذكاء الاصطناعي<br>Ghost AI</div><div class="sub">جاهز للمساعدة • أسلوب محادثة ذكي</div></div>
<div class="badge2">ONLINE •</div>
</div>
<div class="card" style="display:block;cursor:default">
<div class="tabs"><div class="tab active">عام</div><div class="tab">خاص</div></div>
<div class="empty"><div style="font-size:32px">✉️</div><div style="margin-top:8px">لا توجد رسائل خاصة حالياً</div></div>
</div>
</div>
</body>
</html>
